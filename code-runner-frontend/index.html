<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Runner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .editor-container {
            width: 100%;
            height: 300px;
            border: 1px solid #ddd;
            border-radius: 4px;
            overflow: hidden;
        }
        .cm-editor {
            height: 100%;
            font-size: 14px;
        }
        .cm-editor .cm-content {
            font-family: 'Fira Code', monospace;
        }
        .output-container {
            background-color: #1e1e1e;
            color: #fff;
            padding: 15px;
            border-radius: 4px;
            min-height: 100px;
            font-family: monospace;
            white-space: pre-wrap;
        }
        .loading {
            display: none;
            margin: 10px 0;
        }
        .error {
            color: #ff6b6b;
        }
        .language-selector {
            margin-bottom: 1rem;
        }
        .editor-toolbar {
            background-color: #f8f9fa;
            padding: 8px;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .editor-toolbar button {
            margin-left: 8px;
        }
    </style>
</head>
<body class="bg-light">
    <div class="container py-5">
        <h1 class="mb-4">Code Runner</h1>
        
        <div class="row">
            <div class="col-md-8">
                <div class="card mb-4">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">Code Editor</h5>
                        <select id="languageSelect" class="form-select language-selector" style="width: auto;">
                            <option value="python">Python</option>
                            <option value="java">Java</option>
                        </select>
                    </div>
                    <div class="editor-toolbar">
                        <div>
                            <button id="formatButton" class="btn btn-sm btn-outline-secondary">Format Code</button>
                            <button id="clearButton" class="btn btn-sm btn-outline-danger">Clear</button>
                        </div>
                    </div>
                    <div class="card-body p-0">
                        <div id="editor" class="editor-container"></div>
                    </div>
                </div>

                <div class="card mb-4">
                    <div class="card-header">
                        <h5 class="mb-0">Input</h5>
                    </div>
                    <div class="card-body">
                        <textarea id="input" class="form-control" rows="3" placeholder="Enter your input here..."></textarea>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">Output</h5>
                    </div>
                    <div class="card-body">
                        <div class="loading">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                            <span class="ms-2">Running code...</span>
                        </div>
                        <div id="output" class="output-container"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-3">
            <button id="runButton" class="btn btn-primary">Run Code</button>
        </div>
    </div>

    <script type="module">
        import axios from 'axios';
        import { EditorState } from '@codemirror/state';
        import { EditorView, keymap } from '@codemirror/view';
        import { defaultKeymap, indentWithTab } from '@codemirror/commands';
        import { syntaxHighlighting, defaultHighlightStyle } from '@codemirror/language';
        import { python } from '@codemirror/lang-python';
        import { java } from '@codemirror/lang-java';
        import { autocompletion } from '@codemirror/autocomplete';
        import { lintGutter } from '@codemirror/lint';
        import { searchKeymap } from '@codemirror/search';

        // Get DOM elements
        const editorElement = document.getElementById("editor");
        const inputField = document.getElementById("input");
        const outputDiv = document.getElementById("output");
        const runButton = document.getElementById("runButton");
        const loadingDiv = document.querySelector(".loading");
        const languageSelect = document.getElementById("languageSelect");
        const formatButton = document.getElementById("formatButton");
        const clearButton = document.getElementById("clearButton");

        let editorView;

        // Function to create editor state
        function createEditorState(language) {
            const extensions = [
                keymap.of([
                    ...defaultKeymap,
                    indentWithTab,
                    ...searchKeymap
                ]),
                EditorView.lineWrapping,
                syntaxHighlighting(defaultHighlightStyle),
                autocompletion(),
                lintGutter(),
                EditorView.theme({
                    '&': {
                        height: '100%'
                    },
                    '.cm-scroller': {
                        overflow: 'auto'
                    },
                    '.cm-content': {
                        fontFamily: 'Fira Code, monospace',
                        fontSize: '14px'
                    },
                    '.cm-lineNumbers': {
                        minWidth: '3em'
                    }
                })
            ];

            if (language === 'python') {
                extensions.push(python());
            } else if (language === 'java') {
                extensions.push(java());
            }

            return EditorState.create({
                doc: language === 'python' ? '# Write your Python code here' : '// Write your Java code here',
                extensions
            });
        }

        // Initialize editor
        function initEditor(language) {
            if (editorView) {
                editorView.destroy();
            }
            editorView = new EditorView({
                state: createEditorState(language),
                parent: editorElement
            });
        }

        // Function to show error
        function showError(message) {
            outputDiv.innerHTML = `<span class="error">${message}</span>`;
        }

        // Function to show output
        function showOutput(message) {
            outputDiv.textContent = message;
        }

        // Format code
        function formatCode() {
            const doc = editorView.state.doc.toString();
            // Basic formatting for Python
            if (languageSelect.value === 'python') {
                const formatted = doc
                    .split('\n')
                    .map(line => line.trim())
                    .join('\n');
                editorView.dispatch({
                    changes: {
                        from: 0,
                        to: editorView.state.doc.length,
                        insert: formatted
                    }
                });
            }
            // For Java, you might want to use a proper formatter
        }

        // Language change handler
        languageSelect.addEventListener('change', () => {
            initEditor(languageSelect.value);
        });

        // Format button handler
        formatButton.addEventListener('click', formatCode);

        // Clear button handler
        clearButton.addEventListener('click', () => {
            editorView.dispatch({
                changes: {
                    from: 0,
                    to: editorView.state.doc.length,
                    insert: languageSelect.value === 'python' ? '# Write your Python code here' : '// Write your Java code here'
                }
            });
        });

        // Run button click handler
        runButton.addEventListener("click", async () => {
            const code = editorView.state.doc.toString().trim();
            const input = inputField.value;
            const language = languageSelect.value;

            // Don't proceed if code is empty
            if (!code) {
                showError("Please enter some code to run");
                return;
            }

            try {
                // Show loading state
                loadingDiv.style.display = "block";
                outputDiv.textContent = "";
                runButton.disabled = true;

                // Make the request
                const response = await axios.post("/api/run", {
                    language,
                    code,
                    input
                });

                // Update the output
                showOutput(response.data.output || "Program executed successfully (no output)");
            } catch (error) {
                console.error("Error:", error);
                showError(error.response?.data?.error || error.message);
            } finally {
                loadingDiv.style.display = "none";
                runButton.disabled = false;
            }
        });

        // Prevent the page from refreshing
        document.addEventListener('submit', function(e) {
            e.preventDefault();
        });

        // Add error handling for network issues
        window.addEventListener('offline', function() {
            showError("You are offline. Please check your internet connection.");
        });

        window.addEventListener('online', function() {
            showOutput("Back online. You can run your code now.");
        });

        // Initialize editor with Python
        initEditor('python');
    </script>
</body>
</html>
