<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Runner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .editor-container {
            width: 100%;
            height: 300px;
            border: 1px solid #ddd;
            border-radius: 4px;
            overflow: hidden;
        }
        .cm-editor {
            height: 100%;
            font-size: 14px;
        }
        .cm-editor .cm-content {
            font-family: 'Fira Code', monospace;
        }
        .output-container {
            background-color: #1e1e1e;
            color: #fff;
            padding: 15px;
            border-radius: 4px;
            min-height: 100px;
            font-family: monospace;
            white-space: pre-wrap;
            overflow-y: auto; /* Enable scrolling for output */
        }
        .loading {
            display: none;
            margin: 10px 0;
        }
        .error {
            color: #ff6b6b;
        }
        .language-selector {
            margin-bottom: 1rem;
        }
        .editor-toolbar {
            background-color: #f8f9fa;
            padding: 8px;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .editor-toolbar button {
            margin-left: 8px;
        }
        .interactive-input-container {
            display: none;
            margin-top: 10px;
        }
    </style>
</head>
<body class="bg-light">
    <div class="container py-5">
        <h1 class="mb-4">Code Runner</h1>
        
        <div class="row">
            <div class="col-md-8">
                <div class="card mb-4">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">Code Editor</h5>
                        <select id="languageSelect" class="form-select language-selector" style="width: auto;">
                            <option value="python">Python</option>
                            <option value="java">Java</option>
                        </select>
                    </div>
                    <div class="editor-toolbar">
                        <div>
                            <button id="formatButton" class="btn btn-sm btn-outline-secondary">Format Code</button>
                            <button id="clearButton" class="btn btn-sm btn-outline-danger">Clear</button>
                        </div>
                    </div>
                    <div class="card-body p-0">
                        <div id="editor" class="editor-container"></div>
                    </div>
                </div>

                <div class="card mb-4">
                    <div class="card-header">
                        <h5 class="mb-0">Initial Input (for non-interactive programs)</h5>
                    </div>
                    <div class="card-body">
                        <textarea id="initialInput" class="form-control" rows="3" placeholder="Enter initial input here..."></textarea>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">Output</h5>
                    </div>
                    <div class="card-body">
                        <div class="loading">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                            <span class="ms-2">Running code...</span>
                        </div>
                        <div id="output" class="output-container"></div>
                        <div id="interactiveInputContainer" class="interactive-input-container">
                            <input type="text" id="interactiveInput" class="form-control" placeholder="Enter input here and press Enter">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-3">
            <button id="runButton" class="btn btn-primary">Run Code</button>
        </div>
    </div>

    <script type="module">
        import { io } from 'socket.io-client';
        import { EditorState } from '@codemirror/state';
        import { EditorView, keymap } from '@codemirror/view';
        import { defaultKeymap, indentWithTab } from '@codemirror/commands';
        import { syntaxHighlighting, defaultHighlightStyle } from '@codemirror/language';
        import { python } from '@codemirror/lang-python';
        import { java } from '@codemirror/lang-java';
        import { autocompletion } from '@codemirror/autocomplete';
        import { lintGutter } from '@codemirror/lint';
        import { searchKeymap } from '@codemirror/search';

        // Get DOM elements
        const editorElement = document.getElementById("editor");
        const initialInput = document.getElementById("initialInput");
        const outputDiv = document.getElementById("output");
        const runButton = document.getElementById("runButton");
        const loadingDiv = document.querySelector(".loading");
        const languageSelect = document.getElementById("languageSelect");
        const formatButton = document.getElementById("formatButton");
        const clearButton = document.getElementById("clearButton");
        const interactiveInputContainer = document.getElementById("interactiveInputContainer");
        const interactiveInput = document.getElementById("interactiveInput");

        let editorView;
        let socket;

        // Function to create editor state
        function createEditorState(language) {
            const extensions = [
                keymap.of([
                    ...defaultKeymap,
                    indentWithTab,
                    ...searchKeymap // Include search commands from searchKeymap
                ]),
                EditorView.lineWrapping,
                syntaxHighlighting(defaultHighlightStyle),
                autocompletion(),
                lintGutter(),
                EditorView.theme({
                    '&': {
                        height: '100%'
                    },
                    '.cm-scroller': {
                        overflow: 'auto'
                    },
                    '.cm-content': {
                        fontFamily: 'Fira Code, monospace',
                        fontSize: '14px'
                    },
                    '.cm-lineNumbers': {
                        minWidth: '3em'
                    }
                })
            ];

            if (language === 'python') {
                extensions.push(python());
            } else if (language === 'java') {
                extensions.push(java());
            }

            return EditorState.create({
                doc: language === 'python' ? '# Write your Python code here' : '// Write your Java code here',
                extensions
            });
        }

        // Initialize editor
        function initEditor(language) {
            if (editorView) {
                editorView.destroy();
            }
            editorView = new EditorView({
                state: createEditorState(language),
                parent: editorElement
            });
        }

        // Function to show output (append new lines)
        function appendOutput(message, type = 'stdout') {
            const span = document.createElement('span');
            span.textContent = message;
            if (type === 'error') {
                span.classList.add('error');
            }
            outputDiv.appendChild(span);
            outputDiv.scrollTop = outputDiv.scrollHeight; // Auto-scroll to bottom
        }

        // Function to clear output
        function clearOutput() {
            outputDiv.textContent = '';
        }

        // Format code
        function formatCode() {
            const doc = editorView.state.doc.toString();
            // Basic formatting for Python
            if (languageSelect.value === 'python') {
                const formatted = doc
                    .split('\n')
                    .map(line => line.trim())
                    .join('\n');
                editorView.dispatch({
                    changes: {
                        from: 0,
                        to: editorView.state.doc.length,
                        insert: formatted
                    }
                });
            }
            // For Java, you might want to use a proper formatter (more complex for client-side)
        }

        // Language change handler
        languageSelect.addEventListener('change', () => {
            initEditor(languageSelect.value);
            clearOutput();
        });

        // Format button handler
        formatButton.addEventListener('click', formatCode);

        // Clear button handler
        clearButton.addEventListener('click', () => {
            editorView.dispatch({
                changes: {
                    from: 0,
                    to: editorView.state.doc.length,
                    insert: languageSelect.value === 'python' ? '# Write your Python code here' : '// Write your Java code here'
                }
            });
            clearOutput();
        });

        // Handle interactive input
        interactiveInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault(); // Prevent default Enter behavior (new line)
                const inputData = interactiveInput.value;
                appendOutput(`> ${inputData}\n`, 'input'); // Echo input to output
                if (socket) {
                    socket.emit('input', { data: inputData });
                }
                interactiveInput.value = '';
                interactiveInputContainer.style.display = 'none';
            }
        });

        // Run button click handler
        runButton.addEventListener("click", () => {
            const code = editorView.state.doc.toString().trim();
            const input = initialInput.value;
            const language = languageSelect.value;

            // Don't proceed if code is empty
            if (!code) {
                appendOutput("Please enter some code to run", 'error');
                return;
            }

            clearOutput();
            loadingDiv.style.display = "block";
            runButton.disabled = true;
            interactiveInputContainer.style.display = 'none';

            // Establish Socket.IO connection if not already connected
            if (!socket || !socket.connected) {
                socket = io('http://localhost:5000'); // Connect to backend Socket.IO server

                socket.on('connect', () => {
                    console.log('[CLIENT] Connected to Socket.IO server');
                    socket.emit('run_code', { language, code, input });
                });

                socket.on('output', (message) => {
                    if (message.type === 'clear') {
                        clearOutput();
                    } else if (message.type === 'prompt') {
                        appendOutput(message.data);
                        interactiveInputContainer.style.display = 'block';
                        interactiveInput.focus();
                    } else {
                        appendOutput(message.data, message.type);
                    }
                });

                socket.on('execution_end', (data) => {
                    console.log('[CLIENT] Execution ended', data);
                    loadingDiv.style.display = "none";
                    runButton.disabled = false;
                    interactiveInputContainer.style.display = 'none';
                    // Optionally display exit code or other final messages
                    if (data && data.exitCode !== undefined && data.exitCode !== 0) {
                        appendOutput(`\nProgram exited with code ${data.exitCode}.`, 'error');
                    }
                    socket.disconnect(); // Disconnect after execution if it's a one-off run
                });

                socket.on('disconnect', () => {
                    console.log('[CLIENT] Disconnected from Socket.IO server');
                    loadingDiv.style.display = "none";
                    runButton.disabled = false;
                    interactiveInputContainer.style.display = 'none';
                });

                socket.on('connect_error', (err) => {
                    console.error('[CLIENT] Socket.IO connection error:', err);
                    appendOutput(`Connection error: ${err.message}`, 'error');
                    loadingDiv.style.display = "none";
                    runButton.disabled = false;
                    interactiveInputContainer.style.display = 'none';
                });

            } else if (socket.connected) {
                // If already connected, just emit the new code
                socket.emit('run_code', { language, code, input });
            }
        });

        // Prevent the page from refreshing (important for forms)
        document.addEventListener('submit', function(e) {
            e.preventDefault();
        });

        // Add error handling for network issues
        window.addEventListener('offline', function() {
            appendOutput("You are offline. Please check your internet connection.", 'error');
        });

        window.addEventListener('online', function() {
            appendOutput("Back online. You can run your code now.");
        });

        // Initialize editor with Python
        initEditor('python');
    </script>
</body>
</html>
