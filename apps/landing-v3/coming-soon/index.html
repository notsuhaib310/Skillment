    function getCombinedText(el) {
      if (!el || !el.childNodes) return "";
      return Array.from(el.childNodes).map(child => {
        if (child.nodeType === Node.TEXT_NODE) return child.nodeValue;
        if (child.nodeType === Node.ELEMENT_NODE) return getCombinedText(child);
        return "";
      }).join("");
    }
  
    function replaceSplitSpans(el) {
      const fullText = getCombinedText(el);
      if (fullText.trim() === targetText) {
        const chars = replacementText.split("");
        let i = 0;
        function replaceChars(node) {
          if (node.nodeType === Node.TEXT_NODE && i < chars.length) {
            node.nodeValue = chars[i++];
          } else if (node.nodeType === Node.ELEMENT_NODE) {
            node.childNodes.forEach(replaceChars);
          }
        }
        replaceChars(el);
      }
    }
  
    function replaceInTextNode(node) {
      let text = node.nodeValue;
      let changed = false;
      for (const [original, replacement] of Object.entries(otherReplacements)) {
        if (text.includes(original)) {
          text = text.replaceAll(original, replacement);
          changed = true;
        }
      }
      if (changed) node.nodeValue = text;
    }
  
    function walkAndReplace(node) {
      if (node.nodeType === Node.TEXT_NODE) {
        replaceInTextNode(node);
      } else if (node.nodeType === Node.ELEMENT_NODE) {
        replaceSplitSpans(node); // Special headline case
        if (node.tagName === "A" && node.hasAttribute("href")) {
          let href = node.getAttribute("href");
          for (const [original, replacement] of Object.entries(otherReplacements)) {
            if (href.includes(original)) {
              href = href.replaceAll(original, replacement);
            }
          }
          node.setAttribute("href", href);
        }
  
        node.childNodes.forEach(walkAndReplace);
      }
    }
  
    function run() {
      walkAndReplace(document.body);
    }
  
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", run);
    } else {
      run();
    }
  
    const observer = new MutationObserver(run);
    observer.observe(document.body, { childList: true, subtree: true });
